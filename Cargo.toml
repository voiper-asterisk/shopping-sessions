[package]
name = "shopping-sessions"
version = "0.2.1"
edition = "2021"
authors = ["voiper-asterisk <voiper.asterisk@users.noreply.github.com>"]
description = "High-throughput parallel sessionization and attribution engine"
publish = false

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

[features]
stats = []
knobs = []
testkeys = []
pmu = []
tl = []

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
strip = true
